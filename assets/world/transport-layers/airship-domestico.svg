<path d="M528.5,192.7 L392,192.7 Q360,192.7 360,160.7 L360,121.5" class="lm-casing" stroke-width="22"/>
<path d="M528.5,192.7 L392,192.7 Q360,192.7 360,160.7 L360,121.5" class="lm-strand" stroke="#2f6fae" stroke-width="9" data-line="AD"><title>Airship doméstico</title></path>

</g>
